[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renfe-enjoyer-backend"
version = "2.0.6"
description = "Selenium based Renfe season-pass booking bot, exposed over HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "selenium>=4.45",
    # Verifies the activation server's signed licenses (app/activation.py).
    "cryptography>=43",
    # The native window on Windows (app/window.py), over the system's WebView2. Linux
    # opens the browser in app mode instead, so it does not need it.
    "pywebview>=6.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]
# Only to package the desktop executable (packaging/renfe-enjoyer.spec).
build = ["pyinstaller>=6.10"]
# The end-to-end suite in e2e/ (Playwright drives a real browser).
e2e = ["pytest>=8", "playwright>=1.50"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["app"]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
