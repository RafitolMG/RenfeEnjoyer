name: CI

on:
  push:
    branches: [main, develop, ubuntu-dev]
    # A version tag (v2.0.0…) also publishes the Windows executable as a GitHub release.
    tags: ['v*']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  activation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Build the image and check it starts
        run: |
          docker build -t activation .
          key=$(python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K; from cryptography.hazmat.primitives.serialization import Encoding as E, PrivateFormat as P, NoEncryption as N; import base64; print(base64.urlsafe_b64encode(K.generate().private_bytes(E.Raw, P.Raw, N())).decode().rstrip('='))")
          docker run -d --name activation -p 8000:8000 \
            -e ACTIVATION_PRIVATE_KEY="$key" -e ADMIN_PASSWORD=ci activation
          for i in $(seq 60); do curl -fs localhost:8000/health && break; sleep 0.5; done
          curl -fs localhost:8000/health || (docker logs activation; exit 1)
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/admin)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/admin/machines)" = 401

  # Runs the backend tests on Windows and builds the desktop executable there, since
  # PyInstaller cannot cross-compile. The .exe is attached to each run as an artifact.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e './backend[dev,build]'
      - name: Backend tests
        working-directory: backend
        run: pytest -q
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: pyinstaller --noconfirm packaging/renfe-enjoyer.spec
      - name: Start the executable and check it serves the app
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}
          RENFE_NO_BROWSER: '1'
          RENFE_PORT: '8765'
        run: |
          $app = Start-Process dist\RenfeEnjoyer.exe -PassThru -NoNewWindow
          try {
            $health = $null
            for ($i = 0; $i -lt 120 -and $health.status -ne 'ok'; $i++) {
              if ($app.HasExited) { throw "El ejecutable se cerró al arrancar (código $($app.ExitCode))" }
              Start-Sleep -Milliseconds 500
              try { $health = Invoke-RestMethod http://127.0.0.1:8765/api/health } catch {}
            }
            if ($health.status -ne 'ok') { throw 'El ejecutable no llegó a responder' }
            $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
            if ($page.Content -notmatch '<title>Renfe Enjoyer</title>') { throw 'No sirve la interfaz' }
            $activation = Invoke-RestMethod http://127.0.0.1:8765/api/activation
            if (-not $activation.required -or $activation.authorized) {
              throw 'El ejecutable no exige la activación'
            }
            if (-not (Test-Path "$env:LOCALAPPDATA\RenfeEnjoyer\renfe_enjoyer.db")) {
              throw 'No creó la base de datos en %LOCALAPPDATA%\RenfeEnjoyer'
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      # The real thing on Windows: a running onefile executable renamed under itself, a
      # new instance in its own console, and the rollback when the new one fails.
      - name: Build an older executable to update from
        shell: pwsh
        run: |
          (Get-Content backend/app/config.py) -replace '^APP_VERSION = .*', 'APP_VERSION = "0.0.1"' |
            Set-Content backend/app/config.py
          pyinstaller --noconfirm --distpath dist-old --workpath build-old packaging/renfe-enjoyer.spec
          git checkout -- backend/app/config.py
      - name: Self-update hands over to the new version, or rolls back
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}
          RENFE_NO_BROWSER: '1'
          RENFE_PORT: '8766'
          # Unreachable: the staged update is picked up from disk, as after a restart.
          RENFE_ACTIVATION_URL: http://127.0.0.1:9
        run: |
          $version = (Select-String backend/app/config.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $url = 'http://127.0.0.1:8766'
          function Get-Version { try { (Invoke-RestMethod "$url/api/health" -TimeoutSec 2).version } catch { $null } }
          function Wait-Version($expected, $seconds) {
            for ($i = 0; $i -lt $seconds * 2; $i++) {
              if ((Get-Version) -eq $expected) { return }
              Start-Sleep -Milliseconds 500
            }
            throw "No llegó a responder la versión $expected"
          }
          function Sha($path) { (Get-FileHash $path -Algorithm SHA256).Hash.ToLower() }
          function Install-Staged($dir, $staged) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item dist-old\RenfeEnjoyer.exe "$dir\RenfeEnjoyer.exe"
            Copy-Item $staged "$dir\RenfeEnjoyer.exe.new"
            @{ version = $version; sha256 = (Sha $staged) } | ConvertTo-Json -Compress |
              Set-Content -Encoding ascii "$dir\RenfeEnjoyer.exe.new.json"
            $process = Start-Process "$dir\RenfeEnjoyer.exe" -PassThru
            Wait-Version '0.0.1' 60
            if ((Invoke-RestMethod "$url/api/update").state -ne 'ready') { throw 'La actualización no quedó lista' }
            Invoke-RestMethod "$url/api/update" -Method Post | Out-Null
            return $process
          }
          try {
            $dir = "$env:RUNNER_TEMP\update-ok"
            $old = Install-Staged $dir dist\RenfeEnjoyer.exe
            Wait-Version $version 90
            if (-not $old.WaitForExit(30000)) { throw 'El proceso viejo no terminó' }
            if ((Sha "$dir\RenfeEnjoyer.exe") -ne (Sha dist\RenfeEnjoyer.exe)) { throw 'No se reemplazó el ejecutable' }
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\RenfeEnjoyer.exe.old"); $i++) { Start-Sleep -Milliseconds 500 }
            if (Test-Path "$dir\RenfeEnjoyer.exe.old") { throw 'Quedó RenfeEnjoyer.exe.old' }
            Get-Process RenfeEnjoyer -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2

            # where.exe exits at once on the unknown --after-update argument.
            $dir = "$env:RUNNER_TEMP\update-bad"
            $old = Install-Staged $dir "$env:SystemRoot\System32\where.exe"
            for ($i = 0; $i -lt 120; $i++) {
              $state = try { Invoke-RestMethod "$url/api/update" -TimeoutSec 2 } catch { $null }
              if ($state.state -eq 'failed') { break }
              Start-Sleep -Milliseconds 500
            }
            if ($state.state -ne 'failed') { throw 'No se deshizo la actualización fallida' }
            if ((Get-Version) -ne '0.0.1') { throw 'La versión vieja no volvió a servir' }
            if ((Sha "$dir\RenfeEnjoyer.exe") -ne (Sha dist-old\RenfeEnjoyer.exe)) { throw 'No se restauró el ejecutable' }
            # Not -Filter: Win32 wildcards let 'RenfeEnjoyer.exe.*' match RenfeEnjoyer.exe itself.
            $left = Get-ChildItem $dir | Where-Object Name -like 'RenfeEnjoyer.exe.*'
            if ($left) { throw "Quedaron restos: $($left.Name -join ', ')" }
          } finally {
            Get-Process RenfeEnjoyer -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: RenfeEnjoyer-windows
          path: dist/RenfeEnjoyer.exe
          if-no-files-found: error

  linux:
    # 22.04's glibc (2.35): a binary built on a newer one refuses to start on older
    # distributions, and PyInstaller bundles everything but glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e './backend[build]'
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: |
          pyinstaller --noconfirm packaging/renfe-enjoyer.spec
          mv dist/RenfeEnjoyer dist/RenfeEnjoyer-linux
      - name: Start the binary and check it serves the app
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
          RENFE_NO_BROWSER: '1'
          RENFE_PORT: '8765'
          RENFE_ACTIVATION_URL: http://127.0.0.1:9
        run: |
          dist/RenfeEnjoyer-linux > app.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 120); do
            curl -sf http://127.0.0.1:8765/api/health && break
            kill -0 $pid 2>/dev/null || { cat app.log; echo 'El binario se cerró al arrancar'; exit 1; }
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8765/ | grep -q '<title>Renfe Enjoyer</title>'
          curl -sf http://127.0.0.1:8765/api/activation |
            python3 -c "import json, sys; a = json.load(sys.stdin); assert a['required'] and not a['authorized'], a"
          test -f "$XDG_DATA_HOME/RenfeEnjoyer/renfe_enjoyer.db" ||
            { echo 'No creó la base de datos en $XDG_DATA_HOME/RenfeEnjoyer'; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: RenfeEnjoyer-linux
          path: dist/RenfeEnjoyer-linux
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Updates compare the running APP_VERSION with the published one, so a release
      # whose executable reports another version would be offered again forever.
      - name: Check the tag matches APP_VERSION
        shell: bash
        run: |
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/app/config.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con APP_VERSION $version"
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      # The landing page's buttons point at releases/latest/download/<asset>, and the
      # activation server finds each build by name (RELEASE_ASSETS): keep these names.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/RenfeEnjoyer.exe release/RenfeEnjoyer-linux \
            --repo "$GITHUB_REPOSITORY" --title "Renfe Enjoyer $GITHUB_REF_NAME" --latest \
            --notes "Windows 10 u 11 (RenfeEnjoyer.exe) y Linux x86_64 (RenfeEnjoyer-linux, desde una terminal); necesita Google Chrome o Chromium. La primera vez pide activación. Más información en https://renfe.rafitolmg.dev"
