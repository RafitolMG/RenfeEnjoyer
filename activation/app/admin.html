<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Activaciones · Renfe Enjoyer</title>
<link rel="icon" type="image/webp" href="/static/logo.webp">
<link rel="stylesheet" href="/static/theme.css">
<style>
  body { font-size: 15px; line-height: 1.45; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-family: var(--mono); font-size: 13px; font-weight: 600; text-transform: uppercase;
       letter-spacing: 0.14em; color: var(--muted); margin: 0; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters button { border: 1px solid var(--border); background: var(--surface); color: var(--text);
                    border-radius: 4px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .filters .count { color: var(--muted); font-weight: 400; }
  .search { width: 100%; margin-bottom: 12px; padding: 9px 12px; font: inherit; color: inherit;
            background: var(--surface); border: 1px solid var(--border-strong); border-radius: 5px; }
  .search:focus { outline: none; border-color: var(--accent);
                  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .list { display: grid; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
          padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
  .who { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .code { font-family: var(--mono); }
  .badge { align-self: start; justify-self: end; }
  .pending { color: var(--warn); } .approved { color: var(--ok); } .revoked { color: var(--danger); }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 5px; cursor: pointer;
                    border: 1px solid var(--border); background: transparent; color: var(--text); }
  .actions .approve { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
  .actions .revoke { color: var(--danger); border-color: var(--danger); }
  .empty, .error { color: var(--muted); padding: 24px 0; }
  .error { color: var(--danger); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .account { display: flex; gap: 8px; flex-wrap: wrap; }
  .ghost { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 5px; cursor: pointer;
           border: 1px solid var(--border-strong); background: transparent; color: var(--text); }
  .ghost:hover { border-color: var(--accent); }
  .notice { margin: 0 0 20px; padding: 10px 14px; border-radius: 8px; font-size: 14px;
            border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
            background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .notice button { margin-left: 6px; padding: 0; border: 0; background: none; font: inherit;
                   color: var(--accent); text-decoration: underline; cursor: pointer; }
  dialog { width: min(420px, calc(100vw - 32px)); padding: 24px; border-radius: 12px;
           border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgb(0 0 0 / 55%); }
  dialog h2 { font-size: 18px; margin: 0 0 16px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--muted); }
  .field input { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg);
                 border: 1px solid var(--border-strong); border-radius: 8px; }
  .field input:focus { outline: none; border-color: var(--accent);
                       box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .hint { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .primary { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 8px;
             border: 0; background: var(--accent-fill); color: #fff; cursor: pointer; }
  .primary:disabled { opacity: 0.55; cursor: progress; }
  .form-message { font-size: 14px; margin: 0 0 12px; min-height: 1.45em; }
  .form-message.bad { color: var(--danger); } .form-message.good { color: var(--ok); }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tabs button { font: inherit; font-size: 14px; padding: 8px 14px; border: 0; background: none;
                 color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .policy { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; }
  .policy select { font: inherit; padding: 6px 10px; color: inherit; background: var(--surface);
                   border: 1px solid var(--border-strong); border-radius: 5px; }
  .published { color: var(--ok); } .unpublished { color: var(--muted); }
  .history { grid-column: 1 / -1; margin: 0; padding: 10px 12px; list-style: none; font-family: var(--mono);
             font-size: 12.5px; color: var(--muted); background: var(--bg); border: 1px solid var(--border);
             border-radius: 5px; max-height: 260px; overflow-y: auto; }
  .history li { padding: 2px 0; overflow-wrap: anywhere; }
  .alert { margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; font-size: 14px; color: var(--danger);
           border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
           background: color-mix(in srgb, var(--danger) 8%, transparent); }
  #confirm-text { margin: 0 0 18px; }
  .attribution { margin-top: 32px; font-size: 12px; color: var(--muted); }
  .attribution a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Activaciones</h1>
    </div>
    <div class="account">
      <button id="open-password" class="ghost" type="button">Cambiar contraseña</button>
      <button id="logout" class="ghost" type="button">Cerrar sesión</button>
    </div>
  </div>
  <p id="initial-notice" class="notice" hidden>
    Sigues con la contraseña inicial.
    <button type="button" data-open-password>Cámbiala</button>
  </p>
  <p id="alert" class="alert" role="alert" hidden></p>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="machines" aria-selected="true">Equipos</button>
    <button role="tab" data-view="versions" aria-selected="false">Versiones</button>
  </div>
  <section id="machines-view">
  <input id="search" class="search" type="search" autocomplete="off" aria-label="Buscar equipos"
         placeholder="Buscar por nombre, correo, equipo, usuario, IP o ciudad">
  <div class="filters" role="group" aria-label="Filtrar">
    <button data-filter="pending" aria-pressed="true">Pendientes <span class="count"></span></button>
    <button data-filter="approved" aria-pressed="false">Aprobados <span class="count"></span></button>
    <button data-filter="revoked" aria-pressed="false">Revocados <span class="count"></span></button>
    <button data-filter="all" aria-pressed="false">Todos <span class="count"></span></button>
  </div>
  <div id="list" class="list" aria-live="polite"></div>
  </section>
  <section id="versions-view" hidden>
    <div class="policy">
      <label for="min-version">Versión mínima</label>
      <select id="min-version"></select>
    </div>
    <div id="versions" class="list" aria-live="polite"></div>
  </section>
  <p class="attribution">Ubicación aproximada por <a href="https://db-ip.com">DB-IP</a></p>
</main>

<!-- In-page, not window.confirm(): a browser that suppresses a page's dialogs answers
     "no" without showing anything, and nothing gets sent. -->
<dialog id="confirm-dialog" aria-labelledby="confirm-text">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button class="ghost" value="cancel">Cancelar</button>
      <button id="confirm-ok" class="primary" value="ok">Aceptar</button>
    </div>
  </form>
</dialog>

<dialog id="password-dialog" aria-labelledby="password-title">
  <form id="password-form" method="dialog" novalidate>
    <h2 id="password-title">Cambiar contraseña</h2>
    <input type="text" name="username" value="admin" autocomplete="username" hidden>
    <div class="field">
      <label for="current">Contraseña actual</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new">Nueva contraseña</label>
      <input id="new" name="new" type="password" autocomplete="new-password" minlength="12" required>
    </div>
    <p class="hint">Mínimo 12 caracteres.</p>
    <div class="field">
      <label for="repeat">Repite la nueva contraseña</label>
      <input id="repeat" name="repeat" type="password" autocomplete="new-password" required>
    </div>
    <p id="password-message" class="form-message" role="alert"></p>
    <div class="dialog-actions">
      <button id="password-cancel" class="ghost" type="button">Cancelar</button>
      <button id="password-save" class="primary" type="submit">Guardar</button>
    </div>
  </form>
</dialog>
<script>
  const LABELS = { pending: 'Pendiente', approved: 'Aprobado', revoked: 'Revocado' };
  let machines = [];
  let filter = 'pending';
  let query = [];
  // Case- and accent-insensitive: "jose" finds "José".
  const fold = (text) => text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const SEARCHED = ['name', 'contact', 'machine_id', 'hostname', 'os_user', 'os_name', 'locale',
    'request_ip', 'last_ip', 'request_location', 'last_location', 'app_version'];
  function matches(m) {
    if (!query.length) return true;
    const haystack = fold(SEARCHED.map((key) => m[key] ?? '').join(' '));
    return query.every((word) => haystack.includes(word));
  }

  const when = (iso) => iso
    ? new Date(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z')
        .toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })
    : 'nunca';

  function el(tag, attrs = {}, text = '') {
    const node = document.createElement(tag);
    Object.assign(node, attrs);
    if (text) node.textContent = text;
    return node;
  }

  function render() {
    const list = document.getElementById('list');
    list.replaceChildren();
    const found = machines.filter(matches);
    for (const b of document.querySelectorAll('[data-filter]')) {
      const value = b.dataset.filter;
      const count = found.filter((m) => value === 'all' || m.status === value).length;
      b.querySelector('.count').textContent = count ? `(${count})` : '';
    }
    const shown = found.filter((m) => filter === 'all' || m.status === filter);
    if (!shown.length) {
      list.append(el('p', { className: 'empty' }, 'Ninguno.'));
      return;
    }
    for (const m of shown) {
      const card = el('article', { className: 'card' });
      const info = el('div');
      info.append(
        el('div', { className: 'who' }, `${m.name} · ${m.contact}`),
        el('div', { className: 'meta' },
          `Pedido ${when(m.requested_at)} · visto ${when(m.last_seen_at)}` +
          (m.app_version ? ` · v${m.app_version}` : '')),
        el('div', { className: 'meta code' }, `Equipo ${m.machine_id.slice(0, 12)}`),
      );
      const device = [m.hostname, m.os_user].filter(Boolean).join(' · ');
      if (device) info.append(el('div', { className: 'meta code' }, device));
      const system = [m.os_name, m.locale, m.timezone].filter(Boolean).join(' · ');
      if (system) info.append(el('div', { className: 'meta' }, system));
      const place = (ip, location) => [ip, location].filter(Boolean).join(' · ');
      if (m.request_ip) info.append(el('div', { className: 'meta' }, `Pidió desde ${place(m.request_ip, m.request_location)}`));
      if (m.last_ip && m.last_ip !== m.request_ip) {
        info.append(el('div', { className: 'meta' }, `Última conexión desde ${place(m.last_ip, m.last_location)}`));
      }
      const actions = el('div', { className: 'actions' });
      if (m.status !== 'approved') {
        actions.append(button('approve', 'Aprobar', () => act(m.id, 'approve')));
      }
      if (m.status !== 'revoked') {
        actions.append(button('revoke', 'Revocar', () => act(m.id, 'revoke')));
      }
      actions.append(button('', 'Borrar', () => {
        ask(`¿Borrar a ${m.name}?`, 'Borrar').then((ok) => ok && remove(m.id));
      }));
      const history = el('ul', { className: 'history', hidden: !openHistories.has(m.id) });
      actions.append(button('', 'Historial', () => toggleHistory(m.id, history)));
      card.append(info, el('span', { className: `tag badge ${m.status}` }, LABELS[m.status]), actions, history);
      if (openHistories.has(m.id)) fillHistory(m.id, history);
      list.append(card);
    }
  }

  // Kept open across the list's periodic reloads.
  const openHistories = new Set();
  function toggleHistory(id, node) {
    if (openHistories.delete(id)) { node.hidden = true; return; }
    openHistories.add(id);
    node.hidden = false;
    fillHistory(id, node);
  }
  async function fillHistory(id, node) {
    try {
      const entries = await call(`/api/v1/admin/machines/${id}/checkins`);
      node.replaceChildren(...(entries.length ? entries.map((e) => el('li', {},
        [when(e.at), e.ip, e.location, e.app_version && `v${e.app_version}`].filter(Boolean).join(' · ')))
        : [el('li', {}, 'Sin conexiones registradas.')]));
    } catch (error) {
      node.replaceChildren(el('li', { className: 'error' }, error.message));
    }
  }
  const confirmDialog = document.getElementById('confirm-dialog');
  function ask(text, okLabel = 'Aceptar') {
    document.getElementById('confirm-text').textContent = text;
    document.getElementById('confirm-ok').textContent = okLabel;
    confirmDialog.returnValue = '';
    confirmDialog.showModal();
    return new Promise((resolve) => {
      confirmDialog.addEventListener('close', () => resolve(confirmDialog.returnValue === 'ok'), { once: true });
    });
  }
  const alertBox = document.getElementById('alert');
  function showError(message) {
    alertBox.textContent = message;
    alertBox.hidden = !message;
  }
  function button(className, label, onClick) {
    const b = el('button', { className, type: 'button' }, label);
    b.addEventListener('click', onClick);
    return b;
  }

  async function call(path, method = 'GET', body) {
    const response = await fetch(path, {
      method,
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    // The session expired or was closed elsewhere (e.g. by a password change).
    if (response.status === 401) {
      location.replace('/admin/login');
      throw new Error('Sesión caducada');
    }
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      const detail = typeof data.detail === 'string' ? data.detail
        : Array.isArray(data.detail) ? data.detail.map((e) => e.msg).join(', ') : '';
      throw new Error(detail || `${response.status} ${response.statusText}`);
    }
    return response.status === 204 ? null : response.json();
  }

  async function loadAccount() {
    try {
      const me = await call('/api/v1/admin/me');
      document.getElementById('initial-notice').hidden = !me.using_initial_password;
    } catch { /* handled by call() or shown by load() */ }
  }

  // --- password change ---------------------------------------------------------------
  const dialog = document.getElementById('password-dialog');
  const passwordForm = document.getElementById('password-form');
  const passwordMessage = document.getElementById('password-message');
  const saveButton = document.getElementById('password-save');

  function say(text, kind = 'bad') {
    passwordMessage.textContent = text;
    passwordMessage.className = `form-message ${kind}`;
  }

  function openPasswordDialog() {
    passwordForm.reset();
    say('');
    dialog.showModal();
    passwordForm.current.focus();
  }

  for (const opener of document.querySelectorAll('#open-password, [data-open-password]')) {
    opener.addEventListener('click', openPasswordDialog);
  }
  document.getElementById('password-cancel').addEventListener('click', () => dialog.close());

  passwordForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const current = passwordForm.current.value;
    const next = passwordForm.new.value;
    if (!current || !next) return say('Rellena todos los campos.');
    if (next.length < 12) return say('Mínimo 12 caracteres.');
    if (next !== passwordForm.repeat.value) return say('No coinciden.');
    saveButton.disabled = true;
    try {
      await call('/api/v1/admin/password', 'POST', { current_password: current, new_password: next });
      say('Contraseña cambiada.', 'good');
      document.getElementById('initial-notice').hidden = true;
      setTimeout(() => dialog.close(), 1200);
    } catch (error) {
      say(error.message);
    } finally {
      saveButton.disabled = false;
    }
  });

  document.getElementById('logout').addEventListener('click', async () => {
    try { await call('/api/v1/admin/logout', 'POST'); } catch { /* going to the login anyway */ }
    location.replace('/admin/login');
  });

  async function load() {
    try {
      machines = await call('/api/v1/admin/machines');
      render();
    } catch (error) {
      document.getElementById('list').replaceChildren(
        el('p', { className: 'error' }, `No se pudo cargar la lista: ${error.message}`));
    }
  }

  async function act(id, action) {
    showError('');
    try { await call(`/api/v1/admin/machines/${id}/${action}`, 'POST'); } catch (e) { showError(e.message); }
    load();
  }

  async function remove(id) {
    showError('');
    try { await call(`/api/v1/admin/machines/${id}`, 'DELETE'); } catch (e) { showError(e.message); }
    load();
  }

  // --- versions ----------------------------------------------------------------------
  let releases = { github: [], published: [], min_version: null, github_error: null };
  const byVersion = (a, b) => {
    const pa = a.version.split('.').map(Number), pb = b.version.split('.').map(Number);
    for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pb[i] - pa[i];
    return 0;
  };
  function renderVersions() {
    const list = document.getElementById('versions');
    list.replaceChildren();
    if (releases.github_error) list.append(el('p', { className: 'error' }, releases.github_error));
    const published = new Map(releases.published.map((r) => [r.version, r]));
    const rows = new Map(releases.github.map((r) => [r.version, r]));
    for (const r of releases.published) if (!rows.has(r.version)) rows.set(r.version, r);
    const select = document.getElementById('min-version');
    select.replaceChildren(el('option', { value: '' }, 'Ninguna'));
    for (const r of [...releases.published].sort(byVersion)) {
      select.append(el('option', { value: r.version }, `v${r.version}`));
    }
    select.value = releases.min_version ?? '';
    if (!rows.size && !releases.github_error) {
      list.append(el('p', { className: 'empty' }, 'Ninguna.'));
      return;
    }
    const PLATFORMS = { windows: 'Windows', linux: 'Linux' };
    // GitHub's entries list builds by platform; published ones store them flat.
    const builds = (r) => r.assets
      ? Object.fromEntries(Object.entries(r.assets))
      : { windows: { sha256: r.sha256, size: r.size },
          ...(r.linux_sha256 ? { linux: { sha256: r.linux_sha256, size: r.linux_size } } : {}) };
    for (const r of [...rows.values()].sort(byVersion)) {
      const pub = published.get(r.version);
      const pinned = builds(pub ?? r);
      const installs = machines.filter((m) => m.app_version === r.version).length;
      const card = el('article', { className: 'card' });
      const info = el('div');
      info.append(
        el('div', { className: 'who' }, `v${r.version}`),
        el('div', { className: 'meta' },
          (pub ? `Publicada ${when(pub.published_at)}` : 'Sin publicar') +
          ` · ${installs} ${installs === 1 ? 'equipo' : 'equipos'}`),
        ...Object.entries(pinned).map(([platform, build]) => el('div', { className: 'meta code' },
          `${PLATFORMS[platform] ?? platform} · ${(build.size / 1e6).toFixed(1)} MB · SHA-256 ${build.sha256.slice(0, 16)}…`)),
      );
      const actions = el('div', { className: 'actions' });
      actions.append(pub
        ? button('revoke', 'Retirar', () => {
            ask(`¿Dejar de ofrecer la v${r.version}?`, 'Retirar')
              .then((ok) => ok && releaseCall(`/api/v1/admin/releases/${r.version}`, 'DELETE'));
          })
        : button('approve', 'Publicar', () => {
            ask(`¿Ofrecer la v${r.version} a todos los equipos?`, 'Publicar')
              .then((ok) => ok && releaseCall('/api/v1/admin/releases', 'POST', { version: r.version }));
          }));
      card.append(info, el('span', { className: `tag badge ${pub ? 'published' : 'unpublished'}` },
        pub ? 'Publicada' : 'Sin publicar'), actions);
      list.append(card);
    }
  }
  async function loadVersions() {
    try {
      releases = await call('/api/v1/admin/releases');
      renderVersions();
    } catch (error) {
      document.getElementById('versions').replaceChildren(
        el('p', { className: 'error' }, `No se pudo cargar las versiones: ${error.message}`));
    }
  }
  async function releaseCall(path, method, body) {
    showError('');
    try { await call(path, method, body); } catch (e) { showError(e.message); }
    loadVersions();
  }
  document.getElementById('min-version').addEventListener('change', async (event) => {
    const value = event.target.value || null;
    const text = value ? `¿Obligar a actualizar a la v${value} o superior?` : '¿Quitar la versión mínima?';
    if (!(await ask(text))) { event.target.value = releases.min_version ?? ''; return; }
    releaseCall('/api/v1/admin/min-version', 'PUT', { min_version: value });
  });
  for (const tab of document.querySelectorAll('[data-view]')) {
    tab.addEventListener('click', () => {
      for (const other of document.querySelectorAll('[data-view]')) {
        const on = other === tab;
        other.setAttribute('aria-selected', String(on));
        document.getElementById(`${other.dataset.view}-view`).hidden = !on;
      }
      if (tab.dataset.view === 'versions') loadVersions();
    });
  }
  document.getElementById('search').addEventListener('input', (event) => {
    query = fold(event.target.value).split(/\s+/).filter(Boolean);
    render();
  });
  for (const b of document.querySelectorAll('[data-filter]')) {
    b.addEventListener('click', () => {
      filter = b.dataset.filter;
      for (const other of document.querySelectorAll('[data-filter]')) {
        other.setAttribute('aria-pressed', String(other === b));
      }
      render();
    });
  }
  loadAccount();
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
