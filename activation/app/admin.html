<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Activaciones · Renfe Enjoyer</title>
<style>
  /* Same palette as the app: dark by default, light when the system asks for it. */
  :root {
    --bg: #0b0c11; --surface: #14161f; --border: #262a38; --border-strong: #343949;
    --text: #e9eaf0; --muted: #9297ab;
    --accent: #8b5cf6; --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa; --surface: #ffffff; --border: #e3e5ee; --border-strong: #cfd3e1;
      --text: #1a1c25; --muted: #61667a;
      --accent: #7c3aed; --ok: #059669; --warn: #b45309; --danger: #dc2626;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters button { border: 1px solid var(--border); background: var(--surface); color: var(--text);
                    border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .list { display: grid; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
          padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
  .who { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
           border: 1px solid currentColor; align-self: start; justify-self: end; }
  .pending { color: var(--warn); } .approved { color: var(--ok); } .revoked { color: var(--danger); }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
                    border: 1px solid var(--border); background: transparent; color: var(--text); }
  .actions .approve { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions .revoke { color: var(--danger); border-color: var(--danger); }
  .empty, .error { color: var(--muted); padding: 24px 0; }
  .error { color: var(--danger); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .account { display: flex; gap: 8px; flex-wrap: wrap; }
  .ghost { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--border-strong); background: transparent; color: var(--text); }
  .ghost:hover { border-color: var(--accent); }
  .notice { margin: 0 0 20px; padding: 10px 14px; border-radius: 8px; font-size: 14px;
            border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
            background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .notice button { margin-left: 6px; padding: 0; border: 0; background: none; font: inherit;
                   color: var(--accent); text-decoration: underline; cursor: pointer; }
  dialog { width: min(420px, calc(100vw - 32px)); padding: 24px; border-radius: 12px;
           border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgb(0 0 0 / 55%); }
  dialog h2 { font-size: 18px; margin: 0 0 16px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--muted); }
  .field input { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg);
                 border: 1px solid var(--border-strong); border-radius: 8px; }
  .field input:focus { outline: none; border-color: var(--accent);
                       box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .hint { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .primary { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 8px;
             border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .primary:disabled { opacity: 0.55; cursor: progress; }
  .form-message { font-size: 14px; margin: 0 0 12px; min-height: 1.45em; }
  .form-message.bad { color: var(--danger); } .form-message.good { color: var(--ok); }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Activaciones</h1>
    </div>
    <div class="account">
      <button id="open-password" class="ghost" type="button">Cambiar contraseña</button>
      <button id="logout" class="ghost" type="button">Cerrar sesión</button>
    </div>
  </div>
  <p id="initial-notice" class="notice" hidden>
    Sigues con la contraseña inicial.
    <button type="button" data-open-password>Cámbiala</button>
  </p>
  <div class="filters" role="group" aria-label="Filtrar">
    <button data-filter="pending" aria-pressed="true">Pendientes</button>
    <button data-filter="approved" aria-pressed="false">Aprobados</button>
    <button data-filter="revoked" aria-pressed="false">Revocados</button>
    <button data-filter="all" aria-pressed="false">Todos</button>
  </div>
  <div id="list" class="list" aria-live="polite"></div>
</main>

<dialog id="password-dialog" aria-labelledby="password-title">
  <form id="password-form" method="dialog" novalidate>
    <h2 id="password-title">Cambiar contraseña</h2>
    <input type="text" name="username" value="admin" autocomplete="username" hidden>
    <div class="field">
      <label for="current">Contraseña actual</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new">Nueva contraseña</label>
      <input id="new" name="new" type="password" autocomplete="new-password" minlength="12" required>
    </div>
    <p class="hint">Mínimo 12 caracteres.</p>
    <div class="field">
      <label for="repeat">Repite la nueva contraseña</label>
      <input id="repeat" name="repeat" type="password" autocomplete="new-password" required>
    </div>
    <p id="password-message" class="form-message" role="alert"></p>
    <div class="dialog-actions">
      <button id="password-cancel" class="ghost" type="button">Cancelar</button>
      <button id="password-save" class="primary" type="submit">Guardar</button>
    </div>
  </form>
</dialog>
<script>
  const LABELS = { pending: 'Pendiente', approved: 'Aprobado', revoked: 'Revocado' };
  let machines = [];
  let filter = 'pending';

  const when = (iso) => iso
    ? new Date(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z')
        .toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })
    : 'nunca';

  function el(tag, attrs = {}, text = '') {
    const node = document.createElement(tag);
    Object.assign(node, attrs);
    if (text) node.textContent = text;
    return node;
  }

  function render() {
    const list = document.getElementById('list');
    list.replaceChildren();
    const shown = machines.filter((m) => filter === 'all' || m.status === filter);
    if (!shown.length) {
      list.append(el('p', { className: 'empty' }, 'Ninguno.'));
      return;
    }
    for (const m of shown) {
      const card = el('article', { className: 'card' });
      const info = el('div');
      info.append(
        el('div', { className: 'who' }, `${m.name} · ${m.contact}`),
        el('div', { className: 'meta' },
          `Pedido ${when(m.requested_at)} · visto ${when(m.last_seen_at)}` +
          (m.app_version ? ` · v${m.app_version}` : '')),
        el('div', { className: 'meta' }, `Equipo ${m.machine_id.slice(0, 12)}`),
      );
      const actions = el('div', { className: 'actions' });
      if (m.status !== 'approved') {
        actions.append(button('approve', 'Aprobar', () => act(m.id, 'approve')));
      }
      if (m.status !== 'revoked') {
        actions.append(button('revoke', 'Revocar', () => act(m.id, 'revoke')));
      }
      actions.append(button('', 'Borrar', () => {
        if (confirm(`¿Borrar a ${m.name}?`)) remove(m.id);
      }));
      card.append(info, el('span', { className: `badge ${m.status}` }, LABELS[m.status]), actions);
      list.append(card);
    }
  }

  function button(className, label, onClick) {
    const b = el('button', { className, type: 'button' }, label);
    b.addEventListener('click', onClick);
    return b;
  }

  async function call(path, method = 'GET', body) {
    const response = await fetch(path, {
      method,
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    // The session expired or was closed elsewhere (e.g. by a password change).
    if (response.status === 401) {
      location.replace('/admin/login');
      throw new Error('Sesión caducada');
    }
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      const detail = typeof data.detail === 'string' ? data.detail
        : Array.isArray(data.detail) ? data.detail.map((e) => e.msg).join(', ') : '';
      throw new Error(detail || `${response.status} ${response.statusText}`);
    }
    return response.status === 204 ? null : response.json();
  }

  async function loadAccount() {
    try {
      const me = await call('/api/v1/admin/me');
      document.getElementById('initial-notice').hidden = !me.using_initial_password;
    } catch { /* handled by call() or shown by load() */ }
  }

  // --- password change ---------------------------------------------------------------
  const dialog = document.getElementById('password-dialog');
  const passwordForm = document.getElementById('password-form');
  const passwordMessage = document.getElementById('password-message');
  const saveButton = document.getElementById('password-save');

  function say(text, kind = 'bad') {
    passwordMessage.textContent = text;
    passwordMessage.className = `form-message ${kind}`;
  }

  function openPasswordDialog() {
    passwordForm.reset();
    say('');
    dialog.showModal();
    passwordForm.current.focus();
  }

  for (const opener of document.querySelectorAll('#open-password, [data-open-password]')) {
    opener.addEventListener('click', openPasswordDialog);
  }
  document.getElementById('password-cancel').addEventListener('click', () => dialog.close());

  passwordForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const current = passwordForm.current.value;
    const next = passwordForm.new.value;
    if (!current || !next) return say('Rellena todos los campos.');
    if (next.length < 12) return say('Mínimo 12 caracteres.');
    if (next !== passwordForm.repeat.value) return say('No coinciden.');
    saveButton.disabled = true;
    try {
      await call('/api/v1/admin/password', 'POST', { current_password: current, new_password: next });
      say('Contraseña cambiada.', 'good');
      document.getElementById('initial-notice').hidden = true;
      setTimeout(() => dialog.close(), 1200);
    } catch (error) {
      say(error.message);
    } finally {
      saveButton.disabled = false;
    }
  });

  document.getElementById('logout').addEventListener('click', async () => {
    try { await call('/api/v1/admin/logout', 'POST'); } catch { /* going to the login anyway */ }
    location.replace('/admin/login');
  });

  async function load() {
    try {
      machines = await call('/api/v1/admin/machines');
      render();
    } catch (error) {
      document.getElementById('list').replaceChildren(
        el('p', { className: 'error' }, `No se pudo cargar la lista: ${error.message}`));
    }
  }

  async function act(id, action) {
    try { await call(`/api/v1/admin/machines/${id}/${action}`, 'POST'); } catch (e) { alert(e.message); }
    load();
  }

  async function remove(id) {
    try { await call(`/api/v1/admin/machines/${id}`, 'DELETE'); } catch (e) { alert(e.message); }
    load();
  }

  for (const b of document.querySelectorAll('[data-filter]')) {
    b.addEventListener('click', () => {
      filter = b.dataset.filter;
      for (const other of document.querySelectorAll('[data-filter]')) {
        other.setAttribute('aria-pressed', String(other === b));
      }
      render();
    });
  }
  loadAccount();
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
