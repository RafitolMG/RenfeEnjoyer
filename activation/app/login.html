<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Acceso · Renfe Enjoyer</title>
<link rel="icon" type="image/webp" href="/static/logo.webp">
<link rel="stylesheet" href="/static/theme.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; font-size: 15px; line-height: 1.45; }
  .card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
          border-radius: 8px; padding: 28px 24px; }
  h1 { font-family: var(--mono); font-size: 13px; font-weight: 600; text-transform: uppercase;
       letter-spacing: 0.14em; color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg);
          border: 1px solid var(--border-strong); border-radius: 5px; }
  input:focus { outline: none; border-color: var(--accent);
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  button { width: 100%; margin-top: 18px; padding: 11px 18px; font: inherit; font-weight: 600;
           border: 0; border-radius: 5px; background: var(--accent-fill); color: #fff; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--accent-fill-hover); }
  button:disabled { opacity: 0.55; cursor: progress; }
  .error { color: var(--danger); font-size: 14px; margin: 14px 0 0; min-height: 1.45em; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main class="card">
  <h1>Activaciones</h1>
  <form id="login" novalidate>
    <!-- A single admin: the username only helps password managers file the entry. -->
    <input class="visually-hidden" type="text" name="username" value="admin"
           autocomplete="username" tabindex="-1" aria-hidden="true">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           required autofocus>
    <button id="submit" type="submit">Entrar</button>
    <p id="error" class="error" role="alert"></p>
  </form>
</main>
<script>
  const form = document.getElementById('login');
  const submit = document.getElementById('submit');
  const error = document.getElementById('error');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = form.password.value;
    if (!password) {
      error.textContent = 'Escribe la contraseña.';
      return;
    }
    submit.disabled = true;
    error.textContent = '';
    try {
      const response = await fetch('/api/v1/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
        credentials: 'same-origin',
      });
      if (response.ok) {
        location.replace('/admin');
        return;
      }
      const body = await response.json().catch(() => ({}));
      error.textContent = typeof body.detail === 'string' ? body.detail : 'No se pudo iniciar sesión.';
      form.password.select();
    } catch {
      error.textContent = 'No se pudo contactar con el servidor.';
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
